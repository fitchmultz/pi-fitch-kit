name: CI

on:
  push:
    branches: [main]
    paths-ignore: [README.md, CHANGELOG.md, AGENTS.md, LICENSE, 'docs/**']
  pull_request:
    paths-ignore: [README.md, CHANGELOG.md, AGENTS.md, LICENSE, 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_AUTOMATION_REF: a0fdc5780053237ac4ee24f49976ee5449e3aaab # v1.0.1

jobs:
  official:
    name: Current official Pi / Ubuntu / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Check against the declared official Pi version and a clean Git consumer
        run: |
          npm install --global "$(node -p 'require("./automation/package.json").packageManager')"
          official="$(node -p 'require("./extension/package.json").devDependencies["@earendil-works/pi-coding-agent"]')"
          node automation/scripts/qualify.mjs --repo pi-fitch-kit --source "$GITHUB_WORKSPACE/extension" \
            --host official --target "$official" --output "$GITHUB_WORKSPACE/evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: official-failure
          path: evidence
          if-no-files-found: warn
          retention-days: 3

  fork-package:
    name: Build pinned fork / Ubuntu / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      fork-ref: ${{ steps.fork.outputs.commit }}
      fork-supported: ${{ steps.fork-support.outputs.supported }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: fork
        with:
          repository: fitchmultz/pi
          ref: main
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fork/package-lock.json
      - name: Check fork support floor
        id: fork-support
        env:
          FORK_REF: ${{ steps.fork.outputs.commit }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { appendFileSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
          const version = JSON.parse(readFileSync("fork/packages/coding-agent/package.json")).version;
          const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(version);
          assert.ok(match, `Invalid fork version: ${version}`);
          const supported = Number(match[1]) >= 1 && !version.startsWith("1.0.0-");
          appendFileSync(process.env.GITHUB_OUTPUT, `supported=${supported}\n`);
          if (!supported) {
            const receipt = { result: "unattempted", host: "fork", ref: process.env.FORK_REF, version, floor: "1.0.0", reason: "Fork is older than the supported Pi floor; no build or qualification attempted." };
            mkdirSync(`${process.env.RUNNER_TEMP}/fork-evidence`, { recursive: true });
            writeFileSync(`${process.env.RUNNER_TEMP}/fork-evidence/qualification.json`, JSON.stringify(receipt, null, 2) + "\n");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Fork qualification: UNATTEMPTED\n\nFork \`${receipt.ref}\` is Pi ${version}, below the supported 1.0.0 floor. This is not a future-fork pass. Rerun qualification when the maintained fork reaches the floor.\n`);
            console.log(JSON.stringify(receipt));
          }
          NODE
      - name: Build the selected fork once
        if: steps.fork-support.outputs.supported == 'true'
        working-directory: fork
        env:
          FORK_REF: ${{ steps.fork.outputs.commit }}
          PI_OFFLINE: '1'
          PI_TELEMETRY: '0'
        run: |
          npm install --global "$(node -p 'require("../automation/package.json").packageManager')"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run hydrate:model-data
          npm run build:offline
          node ../automation/scripts/pack-fork.mjs . "$RUNNER_TEMP/fork-package" "$FORK_REF"
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.fork-support.outputs.supported == 'true'
        with:
          name: fork-host
          path: ${{ runner.temp }}/fork-package
          if-no-files-found: error
          retention-days: 1
      - name: Retain unsupported fork receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.fork-support.outputs.supported == 'false'
        with:
          name: fork-unattempted
          path: ${{ runner.temp }}/fork-evidence
          if-no-files-found: error
          retention-days: 3

  fork:
    name: Pinned fork / macOS / Node 24
    needs: fork-package
    if: needs.fork-package.outputs.fork-supported == 'true'
    runs-on: macos-latest
    timeout-minutes: 6
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fork-host
          path: ${{ runner.temp }}/fork-package
      - name: Check against the fork and a clean Git consumer
        env:
          PI_COMPAT_FORK_REF: ${{ needs.fork-package.outputs.fork-ref }}
        run: |
          npm install --global "$(node -p 'require("./automation/package.json").packageManager')"
          node automation/scripts/qualify.mjs --repo pi-fitch-kit --source "$GITHUB_WORKSPACE/extension" \
            --host fork --target "$RUNNER_TEMP/fork-package" --output "$GITHUB_WORKSPACE/evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fork-failure
          path: evidence
          if-no-files-found: warn
          retention-days: 3
