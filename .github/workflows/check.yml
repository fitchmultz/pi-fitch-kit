name: CI

on:
  push:
    branches: [main]
    paths-ignore: [README.md, CHANGELOG.md, AGENTS.md, LICENSE, 'docs/**']
  pull_request:
    paths-ignore: [README.md, CHANGELOG.md, AGENTS.md, LICENSE, 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: fitchmultz/.github/.github/workflows/pi-compatibility.yml@5f6e4f2f645b0d71e3c56a3f79fd1585708a5c68 # main
    with:
      automation-ref: 5f6e4f2f645b0d71e3c56a3f79fd1585708a5c68 # main
