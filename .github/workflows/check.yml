name: CI

on:
  push:
    branches: [main]
    paths-ignore: [README.md, CHANGELOG.md, AGENTS.md, LICENSE, 'docs/**']
  pull_request:
    paths-ignore: [README.md, CHANGELOG.md, AGENTS.md, LICENSE, 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: fitchmultz/.github/.github/workflows/pi-compatibility.yml@11d531f79564b555ebf75348d7275eaf0cb6d825 # main
    with:
      automation-ref: 11d531f79564b555ebf75348d7275eaf0cb6d825 # main
